name: E2E

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-matrix:
    name: Deterministic Matrix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run deterministic browser matrix
        run: pnpm test:e2e:matrix

      - name: Upload deterministic Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-deterministic
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  live-settings:
    name: Live Settings
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}

    steps:
      - name: Check live settings API key
        id: live-settings-api-key
        env:
          VITE_OPENAI_API_KEY: ${{ secrets.E2E_SETTINGS_OPENAI_API_KEY }}
        run: |
          if [ -n "$VITE_OPENAI_API_KEY" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'E2E_SETTINGS_OPENAI_API_KEY is not configured; skipping live settings E2E.'
          fi

      - name: Checkout code
        if: ${{ steps.live-settings-api-key.outputs.available == 'true' }}
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: ${{ steps.live-settings-api-key.outputs.available == 'true' }}
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        if: ${{ steps.live-settings-api-key.outputs.available == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        if: ${{ steps.live-settings-api-key.outputs.available == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        if: ${{ steps.live-settings-api-key.outputs.available == 'true' }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Run live settings E2E
        if: ${{ steps.live-settings-api-key.outputs.available == 'true' }}
        env:
          VITE_OPENAI_API_KEY: ${{ secrets.E2E_SETTINGS_OPENAI_API_KEY }}
        run: pnpm test:e2e:live

      - name: Upload live Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-live
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
